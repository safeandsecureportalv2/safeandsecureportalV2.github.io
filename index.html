<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Security Handshake Portal</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            border: 1px solid #30363d;
            padding: 40px;
            border-radius: 8px;
            background-color: #161b22;
            max-width: 500px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border-left-color: #58a6ff;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { color: #58a6ff; margin-bottom: 5px; }
        p { color: #8b949e; font-size: 14px; line-height: 1.5; }
        .footer-token { font-family: monospace; font-size: 11px; color: #484f58; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>SECURE GATEWAY ENFORCED</h2>
        <div class="spinner"></div>
        <p><strong>Status:</strong> Authenticating External Environment Node...</p>
        <p>Please wait while the firewall securely matches your Discord client telemetry credentials and queries the local registry logs.</p>
        <div class="footer-token">SYS_AUTH_ID: 9921-X-CORP-STAGE-1</div>
    </div>
</body>
</html>
